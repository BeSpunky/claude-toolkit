# The STALENESS ALARM for what the payload knows about upstream — projections of registries the house does not control:
#   - tools/firebase-compat/project.mjs → Angular → @angular/fire → firebase, firebase-tools' peers, Cloud Functions'
#     Node runtimes (from npm), and gcloud's versioned archive (still served, projection for the pin);
#   - tools/node-facts/project.mjs → Node's LTS lines and the typescript-node image majors (nodejs.org, MCR);
#   - tools/postgres-debs/project.mjs → the Postgres .deb closures (the PGDG archive's signed indexes, every pin still served),
#     and the pinned dbmate downloads (GitHub, each file against its sha256).
#   - tools/postgres-debs/image-codenames.mjs → whether every image the house composes is still on a Debian release with a
#     closure (MCR). No table and no --write: a red run means add the codename, re-project, release. Weekly here, not before
#     a publish: the images move on their own schedule, and a publish is not when that reaches anyone.
#
# ON A SCHEDULE, NOT ON EVERY PUSH. These checks fail when UPSTREAM moves (a new @angular/fire, a new Node LTS), not
# when a commit is wrong. In the per-push test job they turned every unrelated PR red the day upstream released, and —
# running before the generator tests in the same job — stopped those tests from running at all. So they run weekly
# (a red scheduled run is the alarm: re-project with --write, review, decide whether existing projects need a
# migration), on demand, on a push that touches a projection or its projector, and before every payload publish
# (tools/publish-nx-tools/publish.sh), which is where a stale table would actually reach consumers.
#
# The third check is the same kind of fact with no table: tools/check-runner-image/check.sh pulls the rolling image the
# engine's Docker fallback runs on (typescript-node:<HOUSE_NODE_MAJOR>) and asks whether it still has yarn. Microsoft can
# change that on any day with no commit here, so it is an upstream alarm like the others; a red run says what to decide,
# and there is no --write. It stays out of publish.sh because a publish is not the moment that image reaches anyone: every
# fallback run pulls it. The whole fallback on that image is .github/workflows/runner-image-e2e.yml.
name: upstream tables

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  push:
    branches: [main, development]
    paths:
      - 'tools/firebase-compat/**'
      - 'tools/node-facts/**'
      - 'tools/check-runner-image/**'
      - 'plugins/house/engine/container-engine.sh'
      - 'tools/postgres-debs/**'
      - 'plugins/house/engine/nx-tools/src/generators/_utils/firebase-compat.ts'
      - 'plugins/house/engine/nx-tools/src/generators/_utils/gcloud-archive.ts'
      - 'plugins/house/engine/nx-tools/src/generators/_utils/node-facts.ts'
      - 'plugins/house/engine/nx-tools/src/generators/_utils/postgres-closures.ts'
      - 'plugins/house/engine/nx-tools/src/generators/_utils/versions.ts'

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'BeSpunky/claude-toolkit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Check the Firebase compatibility projection (npm, Google's gcloud archive)
        run: node tools/firebase-compat/project.mjs
      - name: Check the Node facts projection (nodejs.org, MCR)
        if: always()
        run: node tools/node-facts/project.mjs
      - name: Check the Docker fallback's image still has yarn (real docker run, MCR)
        if: always()
        run: bash tools/check-runner-image/check.sh
      - name: Check the Postgres closures projection and the pinned dbmate downloads (the PGDG archive, Debian, GitHub)
        if: always()
        run: node tools/postgres-debs/project.mjs --check
      - name: Check the images the house composes are on a release with a Postgres closure (MCR)
        if: always()
        run: node tools/postgres-debs/image-codenames.mjs
