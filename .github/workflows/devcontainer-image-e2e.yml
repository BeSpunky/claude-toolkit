# A GENERATED devcontainer on a REAL engine and REAL images: docker build of what this checkout generates, for each Node and
# package manager in tools/check-runner-image/devcontainer.sh, then the post-create's package-manager step as the image's
# non-root user. And, for a project wearing `postgres` (tools/check-runner-image/postgres-image.sh), every major the house offers on
# every Debian release it composes, on both architectures: the real `apt-get satisfy`, then a real initdb and boot as that user. Fixtures can state what the installer decides and nothing about whether a real image lets it through, and a
# house devcontainer has no Docker, so this is where that gets observed at all.
#
# Its own workflow, not a job in runner-image-e2e.yml: that one tests the fallback, and keeps the payload's generators out of
# its `paths` so a payload push does not pay for it. This one tests exactly those templates, so it needs a filter of its own,
# and GitHub filters per workflow.
#
# Slow and network-bound, so NOT on every push and not in the pre-push hook: weekly (the images are rolling tags, so this can
# go red with no commit here), on demand, and when a push touches what it tests. Every branch counts, like its sibling: this
# is the only place a change to these templates can get a real-image result before it lands.
name: devcontainer image e2e

on:
  schedule:
    - cron: '23 5 * * 1' # Mondays 05:23 UTC
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'plugins/house/engine/nx-tools/src/generators/devcontainer/*.tpl'
      - 'plugins/house/engine/nx-tools/src/generators/devcontainer/post-create/**'
      - 'plugins/house/engine/nx-tools/src/generators/devcontainer/compose.ts'
      - 'plugins/house/engine/nx-tools/src/generators/_utils/versions.ts'
      - 'plugins/house/engine/nx-tools/src/generators/_utils/package-manager.ts'
      - 'plugins/house/engine/nx-tools/src/generators/_utils/postgres-closures.ts'
      - 'plugins/house/engine/nx-tools/src/generators/_utils/playwright-deps.ts'
      - 'plugins/house/engine/nx-tools/src/layers/postgres.ts'
      - 'plugins/house/engine/nx-tools/src/layers/node.ts'
      - 'plugins/house/engine/nx-tools/src/layers/agent.ts'
      - 'plugins/house/engine/nx-tools/src/generators/postgres/**'
      - 'plugins/house/engine/nx-tools/src/generators/devcontainer/generator.ts'
      - 'tools/check-runner-image/devcontainer.sh'
      - 'tools/check-runner-image/postgres-image.sh'
      - 'tools/check-runner-image/postgres-image.inside.sh'
      - 'tools/check-runner-image/postgres-image.launcher.sh'
      - 'plugins/house/engine/nx-tools/src/generators/dev/files/**'
      - 'tools/check-runner-image/test.sh'
      - '.github/workflows/devcontainer-image-e2e.yml'

permissions:
  contents: read

concurrency:
  group: devcontainer-image-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    if: github.repository == 'BeSpunky/claude-toolkit'
    runs-on: ubuntu-latest
    # Sequential: one project, regenerated per case. A case is about three minutes, unobserved until the first real run.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # 22.18+: house.sh's native road, whose compile runs through Node's type stripping. The case's Node is the image's.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: The checks' own branches, against a fake docker
        run: bash tools/check-runner-image/test.sh
      - name: Every case, on real images
        run: bash tools/check-runner-image/devcontainer.sh

  # Its own job, since each architecture is a runner, and a red one must not hide the other or the cases above.
  postgres-images:
    if: github.repository == 'BeSpunky/claude-toolkit'
    strategy:
      fail-fast: false
      matrix:
        # The closures hold both, and the installer picks by architecture, so a package gone from one is only seen on that one.
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    # Sequential: one project per preset, regenerated per case. A case is about four minutes, unobserved until the first real run.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      # 22.18+, as above. The server's Node is none: the image's tools are asked directly.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: A project wearing postgres, on real images, at every major and Debian release
        run: bash tools/check-runner-image/postgres-image.sh
