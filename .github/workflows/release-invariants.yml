# Guard the release invariants that fail SILENTLY.
#
# A missed `@bespunky/nx-tools` bump announces itself — publish-nx-tools skips, and the next `--sync` installs
# the old payload. A missed PLUGIN bump does not: the repo has the change, the marketplace advertises the old
# version, `/plugin marketplace update` is a no-op, and consumers stay behind forever with nothing to see. This
# repo has shipped that bug twice (`bespunky-workflow` at 2c58e20, then `bespunky-engineering` +
# `bespunky-design-system`), both times from a sweep that crossed plugin boundaries while the commit was named
# after a different plugin. Neither was caught by review; both were caught by looking afterwards.
#
# So this asks, on every push, the one question nobody remembers to: did the thing that should have happened,
# happen? It reports; it never bumps — picking patch vs minor is a judgment call about what a change means to
# consumers, and the fix it prints is a command to run, not an edit it makes.
name: release invariants

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The check compares each plugin against the commit where its version last CHANGED, which can be far
          # back in history. A shallow clone would make that commit unreachable and the check vacuously green —
          # the worst outcome for a guard, since it would report success precisely when it cannot see.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # No install step: the checker deliberately uses only node builtins and `git`, so it runs anywhere and
      # cannot be broken by a dependency that failed to resolve.
      - name: Check release invariants
        run: node tools/check-release-invariants/check.mjs
